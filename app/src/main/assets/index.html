<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zikir Sholat</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600&family=Outfit:wght@300;400;500;600&display=swap">
<style>
/* Layout: satu kolom seluler. Panel kaca gelap berlatar cahaya hijau, navigasi mengambang dengan pil mint yang meluncur, perpindahan halaman berkabur. */
:root{
  --bg:#EDF5F0; --pa:rgba(255,255,255,.82); --pb:rgba(255,255,255,.5); --panel:rgba(10,60,40,.045); --panel2:rgba(10,60,40,.07); --line:rgba(10,60,40,.11);
  --fg:#0B2018; --muted:#58736A; --accent:#0B7A55; --accent-ink:#FFFFFF; --accent-soft:rgba(11,122,85,.12); --accent-glow:rgba(11,122,85,.28);
  --track:rgba(10,60,40,.1); --ring:rgba(10,60,40,.22); --hl:rgba(255,255,255,.9); --shadow:rgba(20,70,50,.12);
  --navbg:rgba(255,255,255,.78); --navshadow:rgba(20,70,50,.18); --toastbg:rgba(255,255,255,.96);
  --glow1:#A9E4C6; --glow2:#CBEFDB; --glow3:#B7E9D0; --glow-op:.85; --zg1:rgba(150,225,190,.55); --zg2:rgba(185,235,208,.6); --danger:#C23B2B;
  color-scheme:light;
  --font-display:"Outfit","Inter",system-ui,sans-serif;
  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-ar:"Amiri","Noto Naskh Arabic",serif;
  --ease:cubic-bezier(.3,.8,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#050A08; --pa:rgba(255,255,255,.065); --pb:rgba(255,255,255,.025); --panel:rgba(255,255,255,.045); --panel2:rgba(255,255,255,.075); --line:rgba(255,255,255,.085);
  --fg:#E9F4EE; --muted:#84A092; --accent:#7BEFB2; --accent-ink:#03160C; --accent-soft:rgba(123,239,178,.14); --accent-glow:rgba(123,239,178,.25);
  --track:rgba(255,255,255,.1); --ring:rgba(255,255,255,.18); --hl:rgba(255,255,255,.06); --shadow:rgba(0,0,0,.28);
  --navbg:rgba(14,26,21,.72); --navshadow:rgba(0,0,0,.5); --toastbg:rgba(20,36,29,.92);
  --glow1:#1D6B49; --glow2:#15523A; --glow3:#0F4533; --glow-op:.55; --zg1:rgba(29,107,73,.5); --zg2:rgba(15,69,51,.5); --danger:#FF9D8F;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#050A08; --pa:rgba(255,255,255,.065); --pb:rgba(255,255,255,.025); --panel:rgba(255,255,255,.045); --panel2:rgba(255,255,255,.075); --line:rgba(255,255,255,.085);
  --fg:#E9F4EE; --muted:#84A092; --accent:#7BEFB2; --accent-ink:#03160C; --accent-soft:rgba(123,239,178,.14); --accent-glow:rgba(123,239,178,.25);
  --track:rgba(255,255,255,.1); --ring:rgba(255,255,255,.18); --hl:rgba(255,255,255,.06); --shadow:rgba(0,0,0,.28);
  --navbg:rgba(14,26,21,.72); --navshadow:rgba(0,0,0,.5); --toastbg:rgba(20,36,29,.92);
  --glow1:#1D6B49; --glow2:#15523A; --glow3:#0F4533; --glow-op:.55; --zg1:rgba(29,107,73,.5); --zg2:rgba(15,69,51,.5); --danger:#FF9D8F;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body);-webkit-font-smoothing:antialiased;padding-block:0 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
.num{font-variant-numeric:tabular-nums}
.ar{font-family:var(--font-ar)}
#glow{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;background:var(--bg)}
#glow i{position:absolute;border-radius:50%;filter:blur(70px);opacity:var(--glow-op);animation:drift 22s ease-in-out infinite alternate}
#glow i:nth-child(1){width:70vmax;height:55vmax;left:-25vmax;top:-18vmax;background:radial-gradient(closest-side,var(--glow1),transparent)}
#glow i:nth-child(2){width:60vmax;height:50vmax;right:-28vmax;top:22vh;background:radial-gradient(closest-side,var(--glow2),transparent);animation-duration:28s;animation-delay:-8s}
#glow i:nth-child(3){width:65vmax;height:50vmax;left:-10vmax;bottom:-24vmax;background:radial-gradient(closest-side,var(--glow3),transparent);animation-duration:25s;animation-delay:-14s}
@keyframes drift{to{transform:translate3d(6vmax,4vmax,0) scale(1.08)}}
#app{max-width:520px;margin:0 auto}

/* Panel kaca */
.panel{background:linear-gradient(180deg,var(--pa),var(--pb));border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(22px) saturate(1.25);-webkit-backdrop-filter:blur(22px) saturate(1.25);box-shadow:inset 0 1px 0 var(--hl),0 12px 40px var(--shadow)}
.pad{padding:20px}
.stack{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rise{animation:rise .6s var(--ease) both;animation-delay:calc(var(--i,0)*70ms)}
@keyframes rise{from{opacity:0;filter:blur(10px);transform:translateY(12px)}}

/* Kepala */
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:calc(26px + env(safe-area-inset-top,0px)*0) 2px 20px}
.hd small{color:var(--muted);font-size:13px}
.hd h1{font:300 clamp(30px,9vw,38px)/1.1 var(--font-display);letter-spacing:-.02em;margin:6px 0 6px}
.hd h1 b{font-weight:500}
.hd p{margin:0;color:var(--muted);font-size:14px}
.logo{width:48px;height:48px;border-radius:16px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:400 26px/1 var(--font-ar);flex:none;box-shadow:0 8px 30px var(--accent-glow)}
h2.t{font:400 13px/1 var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:26px 4px 12px}

/* Beranda */
.lab{font-size:12.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.big{display:flex;align-items:baseline;gap:12px;margin:8px 0 18px}
.big b{font:500 40px/1 var(--font-display);letter-spacing:-.02em}
.big .ar{font-size:30px;color:var(--accent)}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:18px}
.chips button{position:relative;display:flex;flex-direction:column;align-items:center;gap:7px;padding:11px 0 10px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-size:12px;font-weight:500;color:var(--muted);min-width:0;transition:background .25s,color .25s,border-color .25s}
.chips button i{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ring);display:grid;place-items:center;color:var(--accent-ink);transition:.25s}
.chips button.on{border-color:var(--accent);color:var(--fg);background:var(--accent-soft)}
.chips button.ok i{background:var(--accent);border-color:var(--accent)}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:54px;border-radius:16px;background:var(--accent);color:var(--accent-ink);font:500 16px var(--font-display);letter-spacing:.01em;box-shadow:0 10px 34px var(--accent-glow);transition:transform .15s}
.btn:active{transform:scale(.985)}
.btn.ghost{background:var(--panel2);color:var(--fg);box-shadow:none;border:1px solid var(--line);min-height:48px;width:auto;padding:0 20px}
.stat .v{font:300 36px/1 var(--font-display);letter-spacing:-.02em;margin:10px 0 4px}
.stat .v span{font-size:15px;color:var(--muted);margin-left:4px;font-weight:400}
.meter{height:4px;border-radius:9px;background:var(--track);margin-top:12px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .8s var(--ease)}
.info{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:16px 20px;color:var(--muted);font-size:13.5px}
.info b{color:var(--fg);font-weight:500}

/* Bacaan */
.sec{overflow:hidden}
.sec summary{list-style:none;display:grid;grid-template-columns:40px 1fr auto;gap:14px;align-items:center;padding:16px 18px;cursor:pointer}
.sec summary::-webkit-details-marker{display:none}
.sec .n{width:40px;height:40px;border-radius:13px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:500 17px var(--font-display)}
.sec b{display:block;font-weight:500;font-size:15.5px}
.sec small{color:var(--muted);font-size:12.5px}
.sec .chev{color:var(--muted);transition:transform .3s var(--ease)}
.sec.lnk{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;padding:16px 18px;color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
.sec.lnk .n{width:52px;font:400 19px/1 var(--font-ar);direction:rtl}
.sec[open] .chev{transform:rotate(90deg)}
.items{padding:0 18px 18px;display:flex;flex-direction:column}
.it{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.it .a{font:400 18px/1.6 var(--font-ar);direction:rtl;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg)}
.it .x{font-size:12.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:4px 10px;border-radius:99px}
.items .btn{margin-top:14px;min-height:48px;font-size:15px}

/* Setelan */
.row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:16px 18px;border-top:1px solid var(--line);min-height:64px}
.row:first-child{border-top:0}
.row b{display:block;font-weight:500}
.row small{color:var(--muted);font-size:12.5px;line-height:1.4;display:block;margin-top:2px}
.sw{width:50px;height:30px;border-radius:99px;background:var(--track);position:relative;flex:none;transition:background .25s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .3s var(--ease)}
.sw.on{background:var(--accent)}
.sw.on::after{transform:translateX(20px);background:var(--accent-ink)}
.seg{display:inline-flex;background:var(--panel);border-radius:12px;padding:3px;flex:none}
.seg button{padding:8px 13px;border-radius:9px;font-weight:500;font-size:13.5px;color:var(--muted);min-height:36px;transition:.25s}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.danger{color:var(--danger)}
.preview{padding:18px;text-align:center;font-family:var(--font-ar);direction:rtl;line-height:2.1;border-top:1px solid var(--line)}
.note{font-size:13px;color:var(--muted);line-height:1.55}

/* Navigasi mengambang dengan pil meluncur */
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(calc(100% - 32px),488px);z-index:20}
#navin{position:relative;display:grid;grid-template-columns:repeat(3,1fr);padding:6px;border-radius:24px;background:var(--navbg);border:1px solid var(--line);backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3);box-shadow:0 16px 50px var(--navshadow)}
#pill{position:absolute;top:6px;bottom:6px;left:6px;right:6px;border-radius:18px;background:var(--accent);box-shadow:0 6px 22px var(--accent-glow);transition-property:left,right;transition-timing-function:var(--ease);transition-duration:.5s,.5s;z-index:0}
#navin button{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border-radius:18px;color:var(--muted);font:500 14px var(--font-display);transition:color .3s;min-width:0}
#navin button.on{color:var(--accent-ink)}
#navin svg{flex:none}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--toastbg);border:1px solid var(--line);color:var(--fg);padding:11px 16px;border-radius:14px;font-weight:500;font-size:14px;opacity:0;pointer-events:none;transition:.3s var(--ease);max-width:min(92vw,440px);text-align:center;z-index:60;backdrop-filter:blur(16px)}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* Sesi zikir */
#zov{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px);--zs:1}
#zov.open{display:flex}
#zov::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(70% 40% at 15% 0%,var(--zg1),transparent 70%),radial-gradient(60% 40% at 100% 100%,var(--zg2),transparent 70%)}
.zin{width:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;flex:1;min-height:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ztop{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 0 12px}
.ztop b{font:400 18px var(--font-display)}
.ztop b span{color:var(--muted);margin-right:6px;font-weight:300}
.ib{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line)}
.zprog{display:flex;gap:5px}
.zprog div{flex:1;height:3px;border-radius:9px;background:var(--track);overflow:hidden}
.zprog i{display:block;height:100%;background:var(--accent);transition:width .4s var(--ease)}
.zmeta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:12.5px;padding:10px 0 0}
.zbody{flex:1;overflow-y:auto;text-align:center;padding:24px 0 16px;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.zhint{margin-top:auto;padding-top:28px;color:var(--muted);font-size:12.5px;opacity:.75}
.zring.pulse{transform:scale(.93)}
.zar{font-family:var(--font-ar);direction:rtl;line-height:2.15;margin:0 0 14px}
.zar.s{font-size:calc(30px*var(--zs))}.zar.m{font-size:calc(27px*var(--zs))}.zar.l{font-size:calc(23px*var(--zs))}
.zar .mk{color:var(--accent);font-size:.8em;margin:0 3px}
.zta,.zbis{font-family:var(--font-ar);direction:rtl;color:var(--accent);font-size:21px;margin-bottom:8px}
.zmean{color:var(--muted);font-size:14px;line-height:1.7;text-align:left;margin-top:6px}
.znote{display:inline-block;margin-top:12px;padding:5px 12px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-size:12.5px;font-weight:500}
.zdock{padding:12px 0 calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px;border-top:1px solid var(--line)}
.zrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;width:100%}
.zside{min-height:48px;padding:0 10px;border-radius:15px;background:var(--panel2);border:1px solid var(--line);font-weight:500;font-size:14px}
.zq{padding:7px 14px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);font-weight:500;font-size:13px}
.zring{position:relative;width:132px;height:132px;flex:none;display:block;border-radius:50%;transition:transform .15s}
.zring:active{transform:scale(.96)}
.zring svg{width:100%;height:100%;transform:rotate(-90deg)}
.zring circle{fill:none;stroke-width:6}
.zring .bg{stroke:var(--track)}
.zring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .25s;filter:drop-shadow(0 0 8px var(--accent-glow))}
.zring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.zring .c b{font:300 40px/1 var(--font-display);font-variant-numeric:tabular-nums}
.zring .c span{color:var(--muted);font-size:12.5px;margin-top:4px}
.zdone{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;text-align:center;gap:10px;padding:20px}
.zdone .bd{width:80px;height:80px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 0 60px var(--accent-glow)}
.zdone h2{font:300 32px var(--font-display);margin:12px 0 0;letter-spacing:-.01em}
.zdone p{color:var(--muted);max-width:320px;margin:0}
.zfoot{display:flex;gap:10px;padding:12px 0 calc(16px + env(safe-area-inset-bottom,0px))}
.zfoot .btn{flex:1}
@media (prefers-reduced-motion:reduce){#glow i{animation:none}.rise{animation:none}#pill{transition-duration:.01s}}
</style>
</head>
<body>

<div id="glow" aria-hidden="true"><i></i><i></i><i></i></div>
<div id="app"><main id="view"></main></div>
<nav aria-label="Navigasi utama"><div id="navin"><div id="pill"></div></div></nav>
<div id="zov" role="dialog" aria-modal="true" aria-label="Sesi zikir"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';
/* ---------- Isi zikir (dari file Dzikir Ba'da Sholat) ---------- */
  const FATEHAH = {
    bismillah:true,
    ayat:[
      `اَلْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ`,
      `الرَّحْمَنِ الرَّحِيمِ`,
      `مَالِكِ يَوْمِ الدِّينِ`,
      `إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ`,
      `اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ`,
      `صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ`
    ],
    trailing:`آمِينَ`,
    meaning:`Dengan menyebut nama Allah yang Maha Pemurah lagi Maha Penyayang. Segala puji bagi Allah Tuhan semesta alam. Yang Maha Pemurah lagi Maha Penyayang. Yang menguasai Hari Pembalasan. Hanya Engkaulah yang kami sembah dan hanya kepada Engkaulah kami memohon pertolongan. Tunjukilah kami ke jalan yang lurus. (Iaitu) jalan orang-orang yang telah Engkau berikan nikmat kepada mereka, bukan jalan orang-orang yang Engkau murkai dan bukan (pula jalan) orang-orang yang sesat. (Surah Al-Fatehah)`
  };
  const TAUBAH = {
    bismillah:true,
    ayat:[
      `لَقَدْ جَاءَكُمْ رَسُولٌ مِنْ أَنْفُسِكُمْ عَزِيزٌ عَلَيْهِ مَا عَنِتُّمْ حَرِيصٌ عَلَيْكُمْ بِالْمُؤْمِنِينَ رَءُوفٌ رَحِيمٌ`,
      `فَإِنْ تَوَلَّوْا فَقُلْ حَسْبِيَ اللَّهُ لَا إِلَهَ إِلَّا هُوَ عَلَيْهِ تَوَكَّلْتُ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ`
    ],
    meaning:`Dengan nama Allah yang Maha Pemurah lagi Maha Penyayang. Sesungguhnya telah datang kepadamu seorang rasul dari kaummu sendiri, berat terasa olehnya penderitaanmu, sangat menginginkan (keimanan dan keselamatan) bagimu, amat belas kasihan lagi penyayang terhadap orang-orang mukmin. Jika mereka berpaling (dari keimanan), maka katakanlah: cukuplah Allah bagiku, tidak ada Tuhan selain Dia, hanya kepada-Nya aku bertawakkal dan Dia adalah Tuhan yang memiliki Arasy yang agung. (Surah At-Taubah: 128-129)`
  };
  const GABUNGAN = {
    bismillah:true,
    ayat:[
      `وَإِذَا قَرَأْتَ الْقُرْآنَ جَعَلْنَا بَيْنَكَ وَبَيْنَ الَّذِينَ لَا يُؤْمِنُونَ بِالْآخِرَةِ حِجَابًا مَسْتُورًا`,
      `صُمٌّ بُكْمٌ عُمْيٌ فَهُمْ لَا يَعْقِلُونَ`,

  if(red||!v.animate){render();window.scrollTo(0,0);return}
  var out=v.animate([{opacity:1,filter:'blur(0)'},{opacity:0,filter:'blur(12px)',transform:'translateY(6px)'}],{duration:170,easing:'ease-in',fill:'forwards'});
  out.onfinish=function(){render();window.scrollTo(0,0);out.cancel();v.animate([{opacity:0,filter:'blur(12px)'},{opacity:1,filter:'blur(0)'}],{duration:340,easing:'cubic-bezier(.3,.8,.2,1)'})};
}

document.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-tab],[data-act]');
  if(!t){
    if(zs&&ev.target.closest('#zbody')){
      zTap(1);
      var rg=document.querySelector('.zring');if(rg){rg.classList.add('pulse');setTimeout(function(){rg.classList.remove('pulse')},120)}
    }
    return;
  }
  if(t.dataset.tab){go(t.dataset.tab);return}
  var a=t.dataset.act,k=t.dataset.k;
  if(a==='zsel'){zsel=k;S.last=k;save();render()}
  else if(a==='zstart')zOpen(+t.dataset.s);
  else if(a==='zclose')zClose();
  else if(a==='ztap')zTap(+t.dataset.n);
  else if(a==='zskip'&&zs){zs.idx++;zs.count=0;vib(30);zRender()}
  else if(a==='zprev'&&zs){if(zs.count>0)zs.count=0;else zs.idx=Math.max(0,zs.idx-1);vib(30);zRender()}
  else if(a==='vibtog'){S.vibrate=!(S.vibrate!==false);save();if(S.vibrate)vib([90,70,90]);render()}
  else if(a==='theme'){S.theme=t.dataset.v;save();applyTheme();render()}
  else if(a==='font'){S.font=t.dataset.v;save();render()}
  else if(a==='tmset'){S.tm=S.tm||{};S.tm[k]=t.dataset.v;save();render()}
  else if(a==='reset'){
    if(!resetArm){resetArm=true;render();clearTimeout(go.rt);go.rt=setTimeout(function(){resetArm=false;if(view==='setelan')render()},5000)}
    else{resetArm=false;S.zdone={};save();toast('Catatan zikir dihapus');render()}
  }
});
window.addEventListener('hashchange',function(){var h=location.hash.slice(1);if(TABS.some(function(t){return t[0]===h})&&h!==view)go(h)});
window.addEventListener('resize',function(){markNav(false)});
window.__back=function(){if(zs){zClose();return true}return false};

(function init(){
  var h=(location.hash||'').slice(1);if(TABS.some(function(t){return t[0]===h}))view=h;
  applyTheme();buildNav();render();
  requestAnimationFrame(function(){markNav(false)});
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){markNav(false)});
})();
})();
</script>
