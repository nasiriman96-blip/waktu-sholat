<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Waktu Sholat</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: satu kolom ala aplikasi seluler. Hero langit yang berubah mengikuti waktu sholat, daftar waktu, bilah navigasi bawah. */
:root{
  --bg:#EEF4F1; --surface:#FFFFFF; --surface2:#E4EDE9; --fg:#0C2620; --muted:#58706A; --line:#D3E0DA;
  --accent:#0B8A66; --accent-ink:#FFFFFF; --accent-soft:#D6F0E6; --gold:var(--accent); --gold-soft:var(--accent-soft); --danger:var(--fg);
  --shadow:none;
  --font-display:"Bricolage Grotesque","DM Sans",system-ui,sans-serif;
  --font-body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-ar:"Amiri","Noto Naskh Arabic",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#07130F; --surface:#0F211B; --surface2:#16302A; --fg:#E7F3EE; --muted:#8FAAA1; --line:#1E3A32;
  --accent:#3DD6A0; --accent-ink:#04261B; --accent-soft:#12372C; --gold:var(--accent); --gold-soft:var(--accent-soft); --danger:var(--fg);
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#07130F; --surface:#0F211B; --surface2:#16302A; --fg:#E7F3EE; --muted:#8FAAA1; --line:#1E3A32;
  --accent:#3DD6A0; --accent-ink:#04261B; --accent-soft:#12372C; --gold:var(--accent); --gold-soft:var(--accent-soft); --danger:var(--fg);
  --shadow:none; color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--font-body);padding-block:0 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-font-smoothing:antialiased}
#app{max-width:520px;margin:0 auto}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.ar{font-family:var(--font-ar)}
h2{font:700 13px/1 var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:26px 4px 10px}

/* Hero */
.hero{color:var(--fg)}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-top:18px}
.loc{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);padding:8px 13px 8px 10px;border-radius:99px;font-weight:600;font-size:13.5px;max-width:60%}
.loc span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dates{text-align:right;font-size:13px;line-height:1.4;color:var(--muted)}
.dates b{display:block;font-weight:600;font-size:14px;color:var(--fg)}
.ground{padding:44px 0 8px}
.kicker{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.cd{font:800 clamp(52px,17vw,76px)/1 var(--font-display);letter-spacing:-.03em;margin:10px 0 8px;color:var(--accent)}
.nextrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.nextrow .nm{font:700 20px var(--font-display)}
.nextrow .nm small{font:400 22px var(--font-ar);margin-left:8px;color:var(--muted)}
.nextrow .at{color:var(--muted);font-size:14px}
.bar{height:3px;border-radius:9px;background:var(--surface2);margin-top:18px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width 1s linear}
.now{margin-top:10px;font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

/* Cards, lists */
.card{background:var(--surface);border-radius:20px;border:1px solid var(--line);overflow:hidden}
.row{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:10px;padding:13px 14px 13px 16px;border-top:1px solid var(--line);min-height:62px}
.row:first-child{border-top:0}
.row .tag{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--surface2);color:var(--muted)}
.row .nm{font-weight:600;font-size:16px;line-height:1.15}
.row .ar{display:block;font-size:17px;color:var(--muted);line-height:1.2}
.row .tm{font:700 21px var(--font-display);text-align:right;letter-spacing:-.01em}
.row.minor{min-height:52px;padding-block:9px}
.row.minor .tag{width:32px;height:32px;border-radius:10px;background:transparent}
.row.minor .nm{font-weight:500;color:var(--muted);font-size:14.5px}
.row.minor .tm{font-size:16px;font-weight:500;color:var(--muted)}
.row.past:not(.minor) .tm,.row.past:not(.minor) .nm{opacity:.55}
.row.next{background:var(--accent-soft)}
.row.next .tag{background:var(--accent);color:var(--accent-ink)}
.row.cur .tag{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.acts{display:flex;gap:2px}
.ib{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.ib:hover{background:var(--surface2)}
.ib.on{color:var(--accent)}
.ib.done{background:var(--accent);color:var(--accent-ink)}
.ib.done:hover{background:var(--accent)}
.sum{display:flex;justify-content:space-between;align-items:center;margin:26px 4px 10px}
.sum h2{margin:0}
.chip{font-size:12.5px;font-weight:700;background:var(--accent-soft);color:var(--accent);padding:5px 10px;border-radius:99px}
.week{display:flex;gap:6px;margin-top:12px}
.week div{flex:1;text-align:center;font-size:11.5px;color:var(--muted);font-weight:600}
.week i{display:block;margin:5px auto 0;width:100%;max-width:34px;aspect-ratio:1;border-radius:10px;background:var(--surface2);position:relative;overflow:hidden}
.week i b{position:absolute;left:0;right:0;bottom:0;background:var(--accent);opacity:.9}
.week .t i{outline:2px solid var(--accent);outline-offset:1px}
.pad{padding:16px}

/* Tabel bulanan */
.mhead,.hhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:20px 0 12px}
.mhead .t,.hhead .t{text-align:center}
.mhead .t b,.hhead .t b{font:700 19px/1.2 var(--font-display);display:block;text-wrap:balance}
.mhead .t span,.hhead .t span{font-size:13px;color:var(--muted)}
.pn{width:44px;height:44px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:330px}
th{position:sticky;top:0;background:var(--surface);font-size:10px;letter-spacing:.02em;text-transform:uppercase;color:var(--muted);padding:11px 2px;text-align:center;font-weight:700}
td{padding:11px 2px;text-align:center;border-top:1px solid var(--line)}
td:first-child,th:first-child{text-align:left;padding-left:12px;white-space:nowrap}
td:first-child b{font-weight:700}
td:first-child small{color:var(--muted);margin-left:4px;font-size:11.5px}
tr.today td{background:var(--accent-soft);font-weight:700}
tr.fri td:first-child small{color:var(--gold);font-weight:700}

/* Kiblat */
.compass{display:grid;place-items:center;padding:22px 10px 8px}
.compass svg{width:min(100%,340px);height:auto;display:block}
.dial{transition:transform .25s ease-out}
.big{font:800 44px/1 var(--font-display);text-align:center}
.sub{color:var(--muted);text-align:center;margin-top:6px}
.lock{margin:14px auto 0;display:table;padding:8px 16px;border-radius:99px;background:var(--surface2);font-weight:700;font-size:13.5px;color:var(--muted)}
.lock.ok{background:var(--accent);color:var(--accent-ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{background:var(--surface2);color:var(--fg)}
.btn.block{display:flex;width:100%}
.note{font-size:13px;color:var(--muted);line-height:1.5}

/* Kalender */
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow div{text-align:center;font-size:11.5px;font-weight:700;color:var(--muted);padding:4px 0}
.dow div:first-child,.dow div:nth-child(6){color:var(--gold)}
.cell{aspect-ratio:1/1.05;border-radius:14px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;position:relative;min-width:0;border:1px solid var(--line)}
.cell b{font:700 16px var(--font-display)}
.cell small{font-size:10.5px;color:var(--muted);font-weight:500}
.cell.out{opacity:.35;background:transparent;border-color:transparent}
.cell.fri b{color:var(--gold)}
.cell.today{outline:2px solid var(--accent)}
.cell.sel{background:var(--accent);color:var(--accent-ink)}
.cell.sel small,.cell.sel b{color:var(--accent-ink)}
.cell i{position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--gold)}
.cell i.f{background:var(--accent)}
.cell.sel i{background:#fff}
.ev{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.ev:first-child{border-top:0}
.ev .dt{background:var(--gold-soft);color:var(--gold);border-radius:12px;text-align:center;padding:6px 0;line-height:1.1}
.ev .dt b{display:block;font:800 20px var(--font-display)}
.ev .dt span{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.ev .n{font-weight:600}
.ev .n small{display:block;color:var(--muted);font-weight:400;font-size:12.5px}
.ev .left{font-size:12.5px;font-weight:700;color:var(--accent);text-align:right;white-space:nowrap}
.detail{margin-top:12px;padding:16px}
.detail .hj{font:700 20px var(--font-display)}
.pill{display:inline-block;margin:8px 6px 0 0;padding:4px 10px;border-radius:99px;font-size:12.5px;font-weight:600;background:var(--gold-soft);color:var(--gold)}
.pill.f{background:var(--accent-soft);color:var(--accent)}

/* Setelan */
.set{padding:4px 16px}
.set .it{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line);min-height:56px}
.set .it:first-child{border-top:0}
.set .it .l{min-width:0}
.set .it .l b{display:block;font-weight:600}
.set .it .l small{color:var(--muted);font-size:12.5px;line-height:1.4;display:block}
select,input[type=text],input[type=number]{background:var(--surface2);border:1px solid transparent;border-radius:12px;min-height:42px;padding:0 12px;max-width:100%}
select{max-width:56%}
input:focus,select:focus{border-color:var(--accent);outline:none}
.seg{display:inline-flex;background:var(--surface2);border-radius:12px;padding:3px}
.seg.full{display:flex;width:100%}.seg.full button{flex:1}
.seg button{padding:8px 12px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--muted);min-height:36px}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.sw{width:50px;height:30px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw.on{background:var(--accent)}
.sw.on::after{transform:translateX(20px)}
.step{display:inline-flex;align-items:center;gap:2px}
.step button{width:36px;height:36px;border-radius:11px;background:var(--surface2);font-weight:700;font-size:18px}
.step span{min-width:44px;text-align:center;font-weight:700}
.cres{margin-top:8px}
.cres button{display:flex;justify-content:space-between;width:100%;text-align:left;padding:12px 6px;border-top:1px solid var(--line)}
.cres button small{color:var(--muted)}
.coords{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.coords input{width:100%}


/* Zikir */
.zchips{display:flex;gap:6px}
.zchips button{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0 9px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:600;color:var(--muted);min-width:0}
.zchips button i{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;color:var(--accent-ink)}
.zchips button.on{border-color:var(--accent);color:var(--fg)}
.zchips button.ok i{background:var(--accent);border-color:var(--accent)}
.zhero{padding:26px 0 4px}
.zhero .ar{font-size:30px;color:var(--accent);line-height:1.3}
.zhero h1{font:800 30px/1.1 var(--font-display);letter-spacing:-.02em;margin:6px 0 0}
.zhero p{color:var(--muted);margin:8px 0 0}
.zsec{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:14px 16px;border-top:1px solid var(--line);width:100%;text-align:left}
.zsec:first-child{border-top:0}
.zsec .n{width:34px;height:34px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:700 15px var(--font-display)}
.zsec b{display:block;font-weight:600}
.zsec small{color:var(--muted);font-size:12.5px}
.zsec svg{color:var(--muted)}
.zstat{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;padding:0 4px;color:var(--muted);font-size:13.5px}
.zstat b{color:var(--fg);font:700 20px var(--font-display);margin-right:4px}
#zov{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#zov.open{display:flex}
.zin{width:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;flex:1;min-height:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ztop{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 10px}
.ztop b{font:700 16px var(--font-display)}
.zprog{display:flex;gap:5px}
.zprog div{flex:1;height:3px;border-radius:9px;background:var(--surface2);overflow:hidden}
.zprog i{display:block;height:100%;background:var(--accent)}
.zmeta{display:flex;justify-content:space-between;color:var(--muted);font-size:12.5px;font-weight:600;padding:10px 0 0}
.zbody{flex:1;overflow-y:auto;text-align:center;padding:22px 0 20px;-webkit-overflow-scrolling:touch}
.zring{position:relative;width:132px;height:132px;flex:none;display:block;border-radius:50%;-webkit-tap-highlight-color:transparent}
.zring:active{transform:scale(.97)}
.zdock{padding:10px 0 calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px;border-top:1px solid var(--line)}
.zrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;width:100%}
.zside{min-height:48px;padding:0 10px;border-radius:14px;background:var(--surface2);font-weight:700;font-size:14px}
.zdock .zq{margin:0}
.zring svg{width:100%;height:100%;transform:rotate(-90deg)}
.zring circle{fill:none;stroke-width:6}
.zring .bg{stroke:var(--surface2)}
.zring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .25s}
.zring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.zring .c b{font:800 38px/1 var(--font-display);font-variant-numeric:tabular-nums}
.zring .c span{color:var(--muted);font-size:13px;margin-top:4px}
.zar{font-family:var(--font-ar);direction:rtl;line-height:2.15;margin:0 0 14px}
.zar.s{font-size:30px}.zar.m{font-size:27px}.zar.l{font-size:23px}
.zar .mk{color:var(--accent);font-size:.8em;margin:0 3px}
.zta,.zbis{font-family:var(--font-ar);direction:rtl;color:var(--accent);font-size:21px;margin-bottom:8px}
.zmean{color:var(--muted);font-size:14px;line-height:1.65;text-align:left;margin-top:6px}
.znote{display:inline-block;margin-top:12px;padding:5px 12px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-size:12.5px;font-weight:700}
.zfoot{display:flex;gap:10px;padding:12px 0 calc(14px + env(safe-area-inset-bottom,0px))}
.zfoot .btn{flex:1}
.zq{display:inline-block;margin:0 0 18px;padding:7px 14px;border-radius:99px;background:var(--surface2);font-weight:700;font-size:13px}
.zdone{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;text-align:center;gap:10px;padding:20px}
.zdone .bd{width:76px;height:76px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.zdone h2{font:800 28px var(--font-display);margin:10px 0 0;text-transform:none;letter-spacing:-.01em;color:var(--fg)}
.zdone p{color:var(--muted);max-width:320px;margin:0}

/* Nav bawah */
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px max(10px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-right,0px))}
nav div{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 5px;border-radius:14px;color:var(--muted);font-size:11px;font-weight:600;min-height:52px}
nav button.on{color:var(--accent)}
nav button.on svg{background:var(--accent-soft);}
nav svg{width:46px;height:28px;padding:3px 11px;border-radius:99px}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:14px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.25s;max-width:min(92vw,440px);text-align:center;z-index:30}
#toast.show{opacity:1;transform:translate(-50%,0)}
.hidden-sky{display:none}
</style>
</head>
<body>

<div id="app"><main id="view"></main></div>
<nav aria-label="Navigasi utama"><div id="nav"></div></nav>
<div id="zov" role="dialog" aria-modal="true" aria-label="Sesi zikir"></div>
<div id="toast" role="status" aria-live="polite"></div>

/* ---------- Waktu & zona ---------- */
function pad(n){return (n<10?'0':'')+n}
function parts(ms,tz){
  var f=new Intl.DateTimeFormat('en-CA',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}).formatToParts(new Date(ms)),o={};

  return o;
}
function offHours(ms,tz){var p=parts(ms,tz);return (Date.UTC(p.year,p.month-1,p.day,p.hour,p.minute,p.second)-Math.floor(ms/1000)*1000)/3600000}
function iso(y,m,d){return y+'-'+pad(m)+'-'+pad(d)}
function addDays(y,m,d,n){var t=new Date(Date.UTC(y,m-1,d+n));return {y:t.getUTCFullYear(),m:t.getUTCMonth()+1,d:t.getUTCDate()}}
function dowOf(y,m,d){return new Date(Date.UTC(y,m-1,d)).getUTCDay()}

/* ---------- Perhitungan waktu sholat (posisi matahari) ---------- */
var R=Math.PI/180;
function fix(a,b){a=a-b*Math.floor(a/b);return a<0?a+b:a}
function julian(y,m,d){if(m<=2){y-=1;m+=12}var A=Math.floor(y/100),B=2-A+Math.floor(A/4);return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5}
function sunPos(jd){
  var D=jd-2451545,g=fix(357.529+0.98560028*D,360),q=fix(280.459+0.98564736*D,360),
  L=fix(q+1.915*Math.sin(g*R)+0.02*Math.sin(2*g*R),360),e=23.439-0.00000036*D,
  RA=Math.atan2(Math.cos(e*R)*Math.sin(L*R),Math.cos(L*R))/R/15;
  return {decl:Math.asin(Math.sin(e*R)*Math.sin(L*R))/R,eqt:q/15-fix(RA,24)};
}
function calcDay(y,m,d,city,method,asrMode,adj){
  var M=METHODS[method]||METHODS.kemenag,lat=city.lat,lng=city.lng;
  var off=offHours(Date.UTC(y,m-1,d,5),city.tz),J=julian(y,m,d)-lng/360;
  function sun(t){return sunPos(J+t/24)}
  function mid(t){return fix(12-sun(t).eqt,24)}
  function angT(a,t,ccw){var dc=sun(t).decl,v=(-Math.sin(a*R)-Math.sin(dc*R)*Math.sin(lat*R))/(Math.cos(dc*R)*Math.cos(lat*R));if(v>1||v<-1)return NaN;return mid(t)+(ccw?-1:1)*Math.acos(v)/R/15}
  function asrT(f,t){var dc=sun(t).decl,a=-Math.atan(1/(f+Math.tan(Math.abs(lat-dc)*R)))/R;return angT(a,t,false)}
  var t={fajr:5,sunrise:6,dhuhr:12,asr:13,sunset:18,isha:18},r;
  for(var i=0;i<2;i++){
    r={fajr:angT(M.f,t.fajr,true),sunrise:angT(0.833,t.sunrise,true),dhuhr:mid(t.dhuhr),asr:asrT(asrMode==='hanafi'?2:1,t.asr),sunset:angT(0.833,t.sunset,false),isha:M.im?0:angT(M.i,t.isha,false)};
    t=r;
  }
  var night=24-(r.sunset-r.sunrise);
  if(isNaN(r.fajr))r.fajr=r.sunrise-night/7;
  if(isNaN(r.sunrise))r.sunrise=12-6;
  if(isNaN(r.sunset))r.sunset=12+6;
  if(M.im)r.isha=r.sunset+M.im/60; else if(isNaN(r.isha))r.isha=r.sunset+night/7;
  var z=off-lng/15,out={};
  out.fajr=r.fajr+z;out.sunrise=r.sunrise+z;out.dhuhr=r.dhuhr+z;out.asr=r.asr+z;out.maghrib=r.sunset+z;out.isha=r.isha+z;
  var ma=M.adj||{};
  ADJK.forEach(function(k){out[k]=Math.round(out[k]*60+(ma[k]||0)+(adj[k]||0))});
  out.imsak=out.fajr-10;out.duha=out.sunrise+18+(M.adj?2:0);
  out.off=off;out.base=Date.UTC(y,m-1,d);
  return out;
}
function absMs(day,min){return day.base+(min-day.off*60)*60000}
var cache={};
function getDay(y,m,d){
  var key=[y,m,d,S.city.lat,S.city.lng,S.city.tz,S.method,S.asr,ADJK.map(function(k){return S.adj[k]}).join(',')].join('|');
  if(!cache[key]){if(Object.keys(cache).length>400)cache={};cache[key]=calcDay(y,m,d,S.city,S.method,S.asr,S.adj)}
  return cache[key];
}
function fmt(min){
  min=((Math.round(min)%1440)+1440)%1440;var h=Math.floor(min/60),m=min%60;
  if(S.h24)return pad(h)+':'+pad(m);

}

/* ---------- Hijriah ---------- */
var hf=new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{timeZone:'UTC',day:'numeric',month:'numeric',year:'numeric'});
function hijri(y,m,d,extra){
  var t=new Date(Date.UTC(y,m-1,d+(S.hijriAdj||0)+(extra||0),12)),o={};
  hf.formatToParts(t).forEach(function(p){if(p.type!=='literal'&&p.type!=='era')o[p.type]=parseInt(p.value,10)});
  return {d:o.day,m:o.month,y:o.year};
}
function hstr(h){return h.d+' '+HIJ[h.m-1]+' '+h.y+' H'}
function eventOf(h){for(var i=0;i<EVENTS.length;i++)if(EVENTS[i][0]===h.m&&EVENTS[i][1]===h.d)return EVENTS[i][2];return null}
function fastOf(y,m,d,h){
  var out=[],w=dowOf(y,m,d);
  if(w===1)out.push('Puasa sunnah Senin');if(w===4)out.push('Puasa sunnah Kamis');
  if(h.d>=13&&h.d<=15&&h.m!==9&&!(h.m===12&&h.d>=13))out.push('Ayyamul Bidh');
  if(h.m===12&&h.d===9)out.push('Puasa Arafah');if(h.m===1&&(h.d===9||h.d===10))out.push('Puasa '+(h.d===9?'Tasua':'Asyura'));
  if(h.m===9)out.push('Bulan Ramadan');
  return out;
}

/* ---------- Kiblat ---------- */
function qibla(lat,lng){
  var p1=lat*R,p2=KAABA.lat*R,dl=(KAABA.lng-lng)*R;
  var b=Math.atan2(Math.sin(dl),Math.cos(p1)*Math.tan(p2)-Math.sin(p1)*Math.cos(dl))/R;
  var a=Math.sin((p2-p1)/2),c=Math.sin(dl/2);
  var h=a*a+Math.cos(p1)*Math.cos(p2)*c*c;
  return {bearing:fix(b,360),km:2*6371*Math.asin(Math.sqrt(h))};
}

function $(id){return document.getElementById(id)}

function timeline(){ /* semua kejadian kemarin, hari ini, besok */
  var n=nowLoc(),ev=[];
  [-1,0,1].forEach(function(o){
    var dt=addDays(n.y,n.m,n.d,o),day=getDay(dt.y,dt.m,dt.d);
    PR.forEach(function(p){ev.push({k:p.k,day:o,abs:absMs(day,day[p.k]),min:day[p.k]})});
  });
  return {n:n,ev:ev};
}
function status(){
  var T=timeline(),n=T.n,main=['fajr','sunrise','dhuhr','asr','maghrib','isha'],cur=null,nxt=null;
  T.ev.forEach(function(e){
    if(main.indexOf(e.k)>-1&&e.abs<=n.ms)cur=e;
    if(FIVE.indexOf(e.k)>-1&&e.abs>n.ms&&!nxt)nxt=e;
  });
  var prev=null;T.ev.forEach(function(e){if(FIVE.indexOf(e.k)>-1&&e.abs<=n.ms)prev=e});
  var cur2=cur,after=null;
  T.ev.forEach(function(e){if(main.indexOf(e.k)>-1&&e.abs>n.ms&&!after)after=e});
  return {n:n,cur:cur2,nxt:nxt,prev:prev,after:after,T:T};
}

function tickHome(){

function updLock(){
  var el=$('lock');if(!el)return;
  var q=qibla(S.city.lat,S.city.lng),diff=((q.bearing-heading+540)%360)-180;
  var ok=Math.abs(diff)<=4;
  el.className='lock'+(ok?' ok':'');
  el.textContent=ok?'Menghadap kiblat':(diff>0?'Putar ke kanan '+Math.round(Math.abs(diff))+'°':'Putar ke kiri '+Math.round(Math.abs(diff))+'°');
  var dl=$('dial');if(dl)dl.style.transform='rotate('+(-heading)+'deg)';

function onOri(e){
  var h=null;
  if(typeof e.webkitCompassHeading==='number')h=e.webkitCompassHeading;
  else if(e.alpha!=null&&(e.absolute||e.type==='deviceorientationabsolute'))h=fix(360-e.alpha,360);
  if(h==null)return;heading=h;if(view==='kiblat')updLock();
}
function startCompass(){
  var ok=false;
  function bind(){
    window.addEventListener('deviceorientationabsolute',onOri,true);window.addEventListener('deviceorientation',onOri,true);
    compassOn=true;compassMsg='Pegang ponsel mendatar. Jika angka tidak bergerak, kalibrasi kompas dengan gerakan angka 8.';render();
    setTimeout(function(){if(heading==null){compassMsg='Sensor arah tidak tersedia di tampilan ini. Buka halaman di peramban ponsel, atau gunakan kompas ponsel dengan arah '+Math.round(qibla(S.city.lat,S.city.lng).bearing)+'°.';compassOn=false;if(view==='kiblat')render()}},2500);
  }
  try{
    if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
      DeviceOrientationEvent.requestPermission().then(function(r){if(r==='granted')bind();else{compassMsg='Izin sensor ditolak.';render()}}).catch(function(){compassMsg='Izin sensor tidak dapat diminta di sini.';render()});
    }else if(typeof DeviceOrientationEvent!=='undefined')bind();

}

  h+='<h2>Koreksi menit</h2><div class="card set">';

  h+='</div><h2>Tampilan</h2><div class="card set">'
   +'<div class="it"><div class="l"><b>Tema</b></div><div class="seg">'+[['auto','Otomatis'],['light','Terang'],['dark','Gelap']].map(function(t){return '<button data-set="theme" data-v="'+t[0]+'" class="'+(S.theme===t[0]?'on':'')+'">'+t[1]+'</button>'}).join('')+'</div></div>'
   +'<div class="it"><div class="l"><b>Format jam</b></div><div class="seg"><button data-set="h24" data-v="1" class="'+(S.h24?'on':'')+'">24 jam</button><button data-set="h24" data-v="0" class="'+(!S.h24?'on':'')+'">12 jam</button></div></div></div>';
  h+='<h2>Pengingat</h2><div class="card set"><div class="it"><div class="l"><b>Bunyi saat waktu masuk</b><small>Berbunyi dan menampilkan pesan selama halaman ini terbuka. Atur tiap sholat dengan ikon lonceng di Beranda. Nada ini pengingat singkat, bukan rekaman adzan.</small></div><button class="sw'+(S.sound?' on':'')+'" data-act="sound" role="switch" aria-checked="'+S.sound+'" aria-label="Bunyi pengingat"></button></div>'
   +'<div class="it"><div class="l"><b>Uji nada</b></div><button class="btn ghost" data-act="test">Putar</button></div></div>';
  return h;
}
function fillTZ(){var dl=$('tzl');if(!dl)return;try{(Intl.supportedValuesOf('timeZone')||[]).forEach(function(z){var o=document.createElement('option');o.value=z;dl.appendChild(o)})}catch(e){}}
function cityList(q){
  q=(q||'').toLowerCase().trim();var list=q?CITIES.filter(function(c){return c.name.toLowerCase().indexOf(q)>-1}):[];
  $('cres').innerHTML=list.slice(0,8).map(function(c){var i=CITIES.indexOf(c);return '<button data-act="city" data-i="'+i+'"><span>'+esc(c.name)+'</span><small>'+c.tz.split('/')[1].replace('_',' ')+'</small></button>'}).join('')||(q?'<p class="note" style="margin:8px 0 0">Kota tidak ditemukan. Gunakan koordinat manual.</p>':'');
}


/* ---------- Zikir ---------- */
var ZP=[['fajr','Subuh'],['dhuhr','Dzuhur'],['asr','Ashar'],['maghrib','Maghrib'],['isha','Isya']];
var zsel=null,zs=null,RR=88,CIRC=2*Math.PI*RR;
function todayIso(){var n=nowLoc();return iso(n.y,n.m,n.d)}
function zDone(is){return (S.zdone&&S.zdone[is])||{}}
function zStreak(){
  var n=nowLoc(),c=0,o=0;
  function all(o){var dt=addDays(n.y,n.m,n.d,-o),d=zDone(iso(dt.y,dt.m,dt.d));return ZP.every(function(p){return d[p[0]]})}
  if(!all(0))o=1;
  while(o<400&&all(o)){c++;o++}
  return c;
}
function zikirHTML(){
  var st=status();
  if(!zsel){var k=st.cur&&FIVE.indexOf(st.cur.k)>-1?st.cur.k:(st.prev?st.prev.k:'fajr');zsel=k}
  var d=zDone(todayIso()),total=DZIKIR.reduce(function(a,x){return a+x.target},0),cnt=ZP.filter(function(p){return d[p[0]]}).length;
  var pn=ZP.filter(function(p){return p[0]===zsel})[0][1];
  var h='<div class="zhero"><div class="ar">ذِكْر</div><h1>Zikir ba\u2019da sholat</h1><p>Pilih waktu sholat, lalu ketuk lingkaran untuk menghitung tiap bacaan.</p></div>';
  h+='<h2>Hari ini</h2><div class="zchips">'+ZP.map(function(p){return '<button data-act="zsel" data-k="'+p[0]+'" class="'+(zsel===p[0]?'on ':'')+(d[p[0]]?'ok':'')+'" aria-pressed="'+(zsel===p[0])+'"><i>'+(d[p[0]]?ico('check',13,3):'')+'</i>'+p[1]+'</button>'}).join('')+'</div>';
  h+='<button class="btn block" style="margin-top:14px;min-height:52px" data-act="zstart" data-s="0">'+(d[zsel]?'Ulangi zikir ba\u2019da '+pn:'Mulai zikir ba\u2019da '+pn)+'</button>';
  h+='<div class="zstat"><span><b class="num">'+cnt+'</b>dari 5 hari ini</span><span><b class="num">'+zStreak()+'</b>hari berturut-turut</span></div>';
  h+='<h2>Isi bacaan</h2><div class="card">';
  SECTIONS.forEach(function(s,i){
    var t=s.items.reduce(function(a,x){return a+x.target},0),parts=s.title.split(' \u00b7 ');
    h+='<button class="zsec" data-act="zstart" data-s="'+i+'"><span class="n">'+(i+1)+'</span><span><b>'+esc(parts[1]||s.title)+'</b><small>'+s.items.length+' bacaan \u00b7 '+t+' hitungan</small></span>'+ico('next',18,2)+'</button>';
  });
  h+='</div><p class="note" style="margin:12px 4px">Total '+DZIKIR.length+' bacaan dan '+total+' hitungan sekali sesi. Ketuk satu bagian untuk memulai dari bagian itu.</p>';
  return h;
}
function zSecStart(si){var n=0;for(var i=0;i<si;i++)n+=SECTIONS[i].items.length;return n}
function zOpen(si){
  zs={p:zsel,idx:zSecStart(si),count:0,lock:false};
  $('zov').className='open';document.documentElement.style.overflow='hidden';zRender();
}
function zClose(){zs=null;$('zov').className='';$('zov').innerHTML='';document.documentElement.style.overflow='';if(view==='zikir')render()}
function zLen(x){var l=x.ayat.join(' ').length;return l>220?'l':l>90?'m':'s'}
function zRender(){
  var o=$('zov');if(!zs)return;
  var pn=ZP.filter(function(p){return p[0]===zs.p})[0][1],h='';
  var prog=SECTIONS.map(function(s,si){var a=zSecStart(si),b=a+s.items.length,dn=Math.max(0,Math.min(zs.idx,b)-a);return '<div><i style="width:'+Math.round(dn/s.items.length*100)+'%"></i></div>'}).join('');
  if(zs.idx>=DZIKIR.length){
    var is=todayIso();S.zdone=S.zdone||{};S.zdone[is]=S.zdone[is]||{};S.zdone[is][zs.p]=true;
    var ks=Object.keys(S.zdone).sort();if(ks.length>90)delete S.zdone[ks[0]];save();
    try{if(navigator.vibrate)navigator.vibrate([50,80,50,80,120])}catch(e){}
    o.innerHTML='<div class="zin"><div class="ztop"><b>Zikir '+pn+'</b><button class="ib" data-act="zclose" aria-label="Tutup">'+ico('x',22,2)+'</button></div><div class="zdone"><div class="bd">'+ico('check',38,2.4)+'</div><h2>Alhamdulillah</h2><p>Zikir ba\u2019da '+pn+' selesai. Semoga Allah menerima zikir Anda.</p></div><div class="zfoot"><button class="btn" data-act="zclose">Kembali</button></div></div>';
    return;
  }
  var d=DZIKIR[zs.idx],rem=d.target-zs.count,sec=SECTIONS[d.sectionIndex].title,seg=d.ayat.join(' <span class="mk">\u2022</span> ')+(d.trailing?' '+d.trailing:'');
  h='<div class="zin"><div class="ztop"><b>Zikir '+pn+'</b><button class="ib" data-act="zclose" aria-label="Tutup">'+ico('x',22,2)+'</button></div>'
   +'<div class="zprog">'+prog+'</div><div class="zmeta"><span>'+esc(sec)+'</span><span class="num">'+(zs.idx+1)+' / '+DZIKIR.length+'</span></div>'
   +'<div class="zbody" id="zbody">'+(d.taawwudz?'<div class="zta">'+d.taawwudz+'</div>':'')+(d.bismillah?'<div class="zbis">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ</div>':'')
   +'<div class="zar '+zLen(d)+'">'+seg+'</div><div class="zmean">'+esc(d.meaning)+'</div>'+(d.note?'<span class="znote">'+esc(d.note)+'</span>':'')+'</div>'
   +'<div class="zdock">'+(rem>10?'<button class="zq" data-act="ztap" data-n="10">+10 sekaligus</button>':'')
   +'<div class="zrow"><button class="zside" data-act="zprev">Sebelumnya</button>'+'<button class="zring" data-act="ztap" data-n="1" aria-label="Hitung satu"><svg viewBox="0 0 200 200"><circle class="bg" cx="100" cy="100" r="'+RR+'"/><circle class="fg" id="zfg" cx="100" cy="100" r="'+RR+'" stroke-dasharray="'+CIRC+'" stroke-dashoffset="'+(CIRC-Math.min(zs.count/d.target,1)*CIRC)+'"/></svg><div class="c"><b id="zc">'+zs.count+'</b><span>dari '+d.target+'</span></div></button>'
   +'<button class="zside" data-act="zskip">Lewati</button></div></div></div>';
  o.innerHTML=h;
}
function zTap(n){
  if(!zs||zs.lock)return;var d=DZIKIR[zs.idx];if(!d)return;
  zs.count=Math.min(d.target,zs.count+n);
  var fg=$('zfg'),c=$('zc');
  if(fg)fg.style.strokeDashoffset=CIRC-Math.min(zs.count/d.target,1)*CIRC;if(c)c.textContent=zs.count;
  try{if(navigator.vibrate)navigator.vibrate(zs.count>=d.target?[40,60,90]:15)}catch(e){}
  if(zs.count>=d.target){zs.lock=true;setTimeout(function(){if(!zs)return;zs.idx++;zs.count=0;zs.lock=false;zRender();var b=$('zbody');if(b)b.scrollTop=0},420)}
}

/* ---------- Utama ---------- */
function applyTheme(){var r=document.documentElement;if(S.theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',S.theme)}
function render(){
  var v=$('view'),sy=window.scrollY;
  v.innerHTML=({beranda:homeHTML,zikir:zikirHTML,kalender:kalenderHTML,kiblat:qiblaHTML,setelan:setHTML})[view]();
  $('nav').innerHTML=TABS.map(function(t){return '<button data-tab="'+t[0]+'" class="'+(t[0]===view?'on':'')+'" aria-current="'+(t[0]===view)+'">'+ico(t[2],24,1.9)+'<span>'+t[1]+'</span></button>'}).join('');
  if(view==='beranda'){tickHome.sig=undefined;tickHome()}
  if(view==='setelan'){fillTZ()}
  if(view==='kiblat'&&heading!=null)updLock();
  window.scrollTo(0,sy);
}
function go(t){view=t;try{history.replaceState(null,'','#'+t)}catch(e){}window.scrollTo(0,0);render()}
function toast(m){var t=$('toast');t.textContent=m;t.className='show';clearTimeout(toast.t);toast.t=setTimeout(function(){t.className=''},3200)}

/* suara */
var AC=null;
function chime(){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
    var seq=[[523.25,0],[659.25,.5],[783.99,1],[659.25,1.7],[880,2.4],[783.99,3.2],[1046.5,4]],t0=AC.currentTime+.05;
    seq.forEach(function(s){var o=AC.createOscillator(),g=AC.createGain(),o2=AC.createOscillator();
      o.type='sine';o.frequency.value=s[0];o2.type='triangle';o2.frequency.value=s[0]*2;
      g.gain.setValueAtTime(0,t0+s[1]);g.gain.linearRampToValueAtTime(.18,t0+s[1]+.05);g.gain.exponentialRampToValueAtTime(.0008,t0+s[1]+1.6);
      var g2=AC.createGain();g2.gain.value=.25;o.connect(g);o2.connect(g2);g2.connect(g);g.connect(AC.destination);o.start(t0+s[1]);o2.start(t0+s[1]);o.stop(t0+s[1]+1.7);o2.stop(t0+s[1]+1.7)});
    return true;
  }catch(e){return false}
}
var lastTick=Date.now(),fired={};
function alertLoop(){
  var now=Date.now();
  try{
    var T=timeline();
    T.ev.forEach(function(e){
      if(FIVE.indexOf(e.k)>-1&&e.abs>lastTick&&e.abs<=now&&S.alerts[e.k]){
        var id=e.k+e.abs;if(fired[id])return;fired[id]=1;
        var nm=PR.filter(function(p){return p.k===e.k})[0].n;
        toast('Waktu '+nm+' telah masuk ('+fmt(e.min)+')');
        if(S.sound)chime();
        try{if(window.Notification&&Notification.permission==='granted')new Notification('Waktu '+nm,{body:'Telah masuk waktu '+nm+' untuk '+S.city.name})}catch(x){}
      }
    });
  }catch(e){}
  lastTick=now;tickHome();
}

/* interaksi */
document.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-tab],[data-act],[data-set]');if(!t)return;
  if(t.dataset.tab){go(t.dataset.tab);return}
  if(t.dataset.set&&!t.dataset.act){
    var k=t.dataset.set,v=t.dataset.v;
    if(k==='h24')S.h24=v==='1';else S[k]=v;save();applyTheme();cache={};render();return;
  }
  var a=t.dataset.act,k=t.dataset.k,d=+t.dataset.d;
  if(a==='bell'){S.alerts[k]=!S.alerts[k];save();render()}
  else if(a==='done'){var n=nowLoc(),is=iso(n.y,n.m,n.d);S.done[is]=S.done[is]||{};S.done[is][k]=!S.done[is][k];
    var ks=Object.keys(S.done).sort();if(ks.length>60)delete S.done[ks[0]];save();render()}
  else if(a==='mshift'){calM+=d;if(calM<1){calM=12;calY--}if(calM>12){calM=1;calY++}render()}
  else if(a==='cshift'){calM+=d;if(calM<1){calM=12;calY--}if(calM>12){calM=1;calY++}selDay=null;render()}
  else if(a==='pick'){selDay=iso(calY,calM,d);render()}
  else if(a==='city'){S.city=CITIES[+t.dataset.i];cache={};save();toast('Lokasi diganti ke '+S.city.name);render()}
  else if(a==='adj'){S.adj[k]=Math.max(-30,Math.min(30,(S.adj[k]||0)+d));cache={};save();render()}
  else if(a==='hadj'){S.hijriAdj=Math.max(-3,Math.min(3,S.hijriAdj+d));save();render()}
  else if(a==='sound'){S.sound=!S.sound;save();if(S.sound)chime();render()}
  else if(a==='test'){if(!chime())toast('Perangkat ini tidak dapat memutar suara.')}
  else if(a==='compass')startCompass();
  else if(a==='kmode'){kmode=k;try{history.replaceState(null,'','#kalender')}catch(e){}render()}
  else if(a==='zsel'){zsel=k;render()}
  else if(a==='zstart')zOpen(+t.dataset.s);
  else if(a==='zclose')zClose();
  else if(a==='ztap')zTap(+t.dataset.n);
  else if(a==='zskip'&&zs){zs.idx++;zs.count=0;zRender()}
  else if(a==='zprev'&&zs){if(zs.count>0)zs.count=0;else zs.idx=Math.max(0,zs.idx-1);zRender()}
  else if(a==='gps'){
    if(!navigator.geolocation){toast('Perangkat tidak mendukung lokasi. Pilih kota atau isi koordinat.');return}
    navigator.geolocation.getCurrentPosition(function(p){
      var la=p.coords.latitude,ln=p.coords.longitude,best=null,bd=1e9;
      CITIES.forEach(function(c){var q=qibla(la,ln);var dd=Math.hypot(c.lat-la,(c.lng-ln)*Math.cos(la*R))*111;if(dd<bd){bd=dd;best=c}});
      var tz=(Intl.DateTimeFormat().resolvedOptions().timeZone)||'UTC';
      S.city={name:bd<40?best.name+' (GPS)':'Lokasi saya',lat:la,lng:ln,tz:tz};cache={};save();toast('Lokasi diperbarui');render();
    },function(){toast('Izin lokasi ditolak atau tidak tersedia di tampilan ini. Pilih kota atau isi koordinat manual.')},{timeout:10000,maximumAge:600000});
  }
  else if(a==='manual'){
    var la=parseFloat($('mlat').value),ln=parseFloat($('mlng').value),tz=($('mtz').value||'').trim()||S.city.tz,nm=($('mname').value||'').trim()||'Lokasi manual';
    if(!(la>=-90&&la<=90)||!(ln>=-180&&ln<=180)){toast('Isi lintang antara −90 dan 90, bujur antara −180 dan 180.');return}
    try{new Intl.DateTimeFormat('en',{timeZone:tz})}catch(e){toast('Zona waktu tidak dikenal. Contoh: Asia/Makassar.');return}
    S.city={name:nm,lat:la,lng:ln,tz:tz};cache={};save();toast('Lokasi disimpan');render();
  }
});
document.addEventListener('input',function(e){if(e.target.id==='csearch')cityList(e.target.value)});
document.addEventListener('change',function(e){
  if(e.target.id==='method'){S.method=e.target.value;cache={};save();var m=$('mdesc');if(m)m.textContent=METHODS[S.method].d;toast('Metode: '+METHODS[S.method].n)}
});
window.addEventListener('hashchange',function(){var h=location.hash.slice(1);if(h==='jadwal'||h==='hijriah'){kmode=h;h='kalender'}if(TABS.some(function(t){return t[0]===h})&&h!==view){view=h;render()}});

window.__back=function(){if(zs){zClose();return true}return false};
/* mulai */
(function init(){
  var n=nowLoc();calY=n.y;calM=n.m;
  var h=(location.hash||'').slice(1);if(h==='jadwal'||h==='hijriah'){kmode=h;h='kalender'}if(TABS.some(function(t){return t[0]===h}))view=h;
  applyTheme();render();setInterval(alertLoop,1000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden){lastTick=Date.now();tickHome()}});
})();
})();
</script>
