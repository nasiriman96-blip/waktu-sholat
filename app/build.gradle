plugins {
    id 'com.android.application'
}

android {
    namespace 'id.waktusholat.app'
    compileSdk 34

    defaultConfig {
        applicationId 'id.waktusholat.app'
        minSdk 27
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName '1.0'
    }
    signingConfigs {
        debug {
            storeFile file('waktu-sholat.keystore')
            storePassword 'waktusholat'
            keyAlias 'waktusholat'
            keyPassword 'waktusholat'
        }
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
