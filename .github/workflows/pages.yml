name: Deploy PWA (GitHub Pages)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Siapkan situs
        run: |
          mkdir _site
          cp -r app/src/main/assets/. _site/
          cd _site
          sed -i "s/__VERSION__/${GITHUB_RUN_NUMBER}/" sw.js
          find . -type f ! -name sw.js ! -name precache.json | sed 's|^\./||' | python3 -c "import sys,json;print(json.dumps(['./']+[l.strip() for l in sys.stdin if l.strip()]))" > precache.json
          touch .nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
